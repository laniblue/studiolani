<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무료 진단 신청 · 스튜디오 라니</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:"Pretendard Variable",Pretendard,sans-serif;word-break:keep-all}
.w{max-width:640px;margin:0 auto;padding:56px 22px 80px}
.k{color:#4d8dff;font-weight:700;font-size:15px;text-align:center;margin:0}
h1{font-size:40px;line-height:1.25;text-align:center;margin:14px 0 18px;font-weight:800;letter-spacing:-1px}
.s{text-align:center;color:#b8bfcc;font-size:16px;line-height:1.7;margin:0 0 56px}
label{display:block;font-size:16px;color:#e6e9ef;margin:0 0 22px}
label b{color:#f04452;margin-left:3px}
input,textarea,select{display:block;width:100%;margin-top:10px;background:#f7f7f7;border:0;border-radius:4px;color:#111;font-size:16px;padding:12px;font-family:inherit}
textarea{min-height:96px;resize:vertical}
.tel{display:flex;gap:8px;align-items:center;margin-top:10px}.tel input{margin:0;width:90px}
.file{margin-top:10px;font-size:14px;color:#b8bfcc}
.pv{background:#f7f7f7;color:#666;font-size:13px;line-height:1.7;padding:14px;border-radius:4px;max-height:170px;overflow:auto;margin-top:10px}
.agree{display:flex;align-items:center;gap:10px;font-size:16px}.agree input{width:22px;height:22px;margin:0}
button{display:block;margin:30px 0 0 auto;background:#1664ff;color:#fff;border:0;border-radius:99px;font-weight:700;font-size:15px;padding:14px 26px;cursor:pointer;font-family:inherit}
</style></head><body><div class="w">
<p class="k">Contact</p>
<h1>무료 진단<br>시작해보세요</h1>
<p class="s">계정을 살펴본 뒤 2~3일 안에<br>무료 진단 리포트를 보내드립니다.</p>
<form action="https://formsubmit.co/info@studiolani.kr" method="POST" enctype="multipart/form-data">
  <input type="hidden" name="_subject" value="[무료 진단 신청] 새 신청이 들어왔어요">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_next" value="https://laniblue.github.io/studiolani/report/thanks.html">
  <input type="text" name="_honey" style="display:none">
  <label>1. 업체명<b>•</b><input name="1. 업체명" required></label>
  <label>2. 업종<b>•</b><input name="2. 업종" required></label>
  <label>3. 연락처<b>•</b><div class="tel"><input name="3. 연락처(앞)" inputmode="numeric" maxlength="3" required> - <input name="3. 연락처(가운데)" inputmode="numeric" maxlength="4" required> - <input name="3. 연락처(끝)" inputmode="numeric" maxlength="4" required></div></label>
  <label>4. 진단받을 인스타그램 계정 주소<b>•</b><input name="4. 인스타그램 주소" required></label>
  <label>5. 가장 막히는 점<b>•</b><textarea name="5. 가장 막히는 점" required></textarea></label>
  <label>6. 인스타툰으로 기대하는 변화<b>•</b><textarea name="6. 기대하는 변화" required></textarea></label>
  <label>7. 현재 SNS 운영 상황<b>•</b><select name="7. SNS 운영 상황" required><option value="">(선택)</option><option>직접 운영</option><option>대행 중</option><option>운영 안함</option></select></label>
  <label>8. 참고하고 싶은 계정이나 레퍼런스<input name="8. 참고 계정·링크" placeholder="계정 주소나 링크"><div class="file">파일 올리기 (선택)<input type="file" name="attachment" accept="image/*,application/pdf"></div></label>
  <label>개인정보 수집 및 이용 동의<b>•</b><div class="pv">스튜디오 라니는 무료 인스타 진단 리포트 발송을 위해 아래 정보를 수집합니다.<br><br>· 수집 항목: 업체명, 업종, 연락처, 인스타그램 계정 주소, 작성하신 내용·첨부 파일<br>· 이용 목적: 진단 리포트 작성 및 발송, 관련 상담 연락<br>· 보유 기간: 리포트 발송 후 1년 또는 삭제 요청 시까지<br>· 전송 위탁: 신청 내용은 폼 전송 서비스(FormSubmit)를 거쳐 스튜디오 라니 메일(info@studiolani.kr)로 전달됩니다.<br><br>동의를 거부할 수 있으며, 거부 시 진단 신청이 제한됩니다.</div></label>
  <label class="agree"><input type="checkbox" required> 개인정보 수집 및 이용에 동의합니다.</label>
  <button type="submit">무료 진단 리포트 받기</button>
</form></div></body></html>
